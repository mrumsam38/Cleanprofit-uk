name: CleanProfit safety checks
on:
  push:
    branches: [main, development/product-reliability]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application structure and JavaScript syntax
        run: node tests/smoke.cjs
