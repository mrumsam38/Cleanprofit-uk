<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CleanProfit UK — Calendar V2 Preview</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#183b30;background:#f3f7f5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:25px;margin:0}h2{margin:0;font-size:21px}.muted{color:#74867e;font-size:13px}.pill{background:#e4f2eb;color:#136448;border-radius:30px;padding:7px 12px;font-size:12px}.panel{background:#fff;border:1px solid #e0e9e4;border-radius:18px;padding:22px;box-shadow:0 5px 25px #153f2a0a}button{font:inherit;cursor:pointer;border:1px solid #dce8e1;border-radius:10px;padding:11px 14px;background:#fff;color:#24483b}button:focus-visible{outline:3px solid #87c4a2}.primary{background:#087b59;border-color:#087b59;color:white}.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:18px 0}.controls{display:flex;gap:7px;align-items:center}.view button.active{background:#e4f3eb;color:#087b59;border-color:#91c4ab;font-weight:700}.weekdays,.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{text-align:center;color:#708478;font-size:12px;font-weight:700;padding:13px 0}.month{border-top:1px solid #e3ebe6;border-left:1px solid #e3ebe6}.date{min-height:125px;text-align:left;border:0;border-right:1px solid #e3ebe6;border-bottom:1px solid #e3ebe6;border-radius:0;padding:10px;background:white;display:flex;flex-direction:column;gap:6px;min-width:0}.date:hover{background:#f6fbf8}.date.selected{box-shadow:inset 0 0 0 2px #087b59}.date.other{color:#b0bbb4;background:#fafbfa}.date .num{font-weight:700}.event{background:#e1f2e8;border-left:3px solid #087b59;border-radius:5px;padding:5px 6px;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#145a41}.event.blue{background:#e7f0fb;border-color:#5488b8;color:#2d5d84}.event.purple{background:#eee9fa;border-color:#8d6fc3;color:#5b448b}.timeline{overflow-x:auto;border:1px solid #e0e9e4;border-radius:12px}.timegrid{display:grid;grid-template-columns:55px repeat(var(--days),minmax(125px,1fr));min-width:calc(55px + var(--days)*125px)}.timehead{background:#f3f8f5;text-align:center;padding:14px 5px;font-weight:700;border-bottom:1px solid #dce8e1;border-right:1px solid #e5ede8}.hours{position:relative;height:840px}.hours span{position:absolute;right:8px;transform:translateY(-50%);font-size:11px;color:#74877c}.track{position:relative;height:840px;border-left:1px solid #e5ede8;background:repeating-linear-gradient(to bottom,#fff 0px,#fff 59px,#e8eeea 59px,#e8eeea 60px)}.block{position:absolute;left:5px;right:5px;border:0;border-left:4px solid #087b59;border-radius:7px;background:#dff2e8;color:#174d38;text-align:left;padding:7px;display:flex;flex-direction:column;gap:3px;font-size:11px;overflow:hidden}.block.blue{background:#e7f0fb;border-color:#5488b8;color:#2d5d84}.block.purple{background:#eee9fa;border-color:#8d6fc3;color:#5b448b}.agenda{margin-top:22px}.appointment{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid #edf1ee}.appointment .time{min-width:65px;color:#087b59;font-weight:700}.appointment .details{flex:1}.appointment .details strong{display:block}.mobile-datebar{display:none}.mobile-list{display:none}.drawer{position:fixed;inset:0;background:#0b241a80;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.drawer.open{display:flex}.dialog{background:white;border-radius:18px;padding:24px;width:min(450px,100%);box-shadow:0 10px 45px #0002}.dialog label{display:block;font-weight:600;font-size:13px;margin:12px 0 6px}.dialog input,.dialog select{width:100%;padding:12px;border:1px solid #d5e4da;border-radius:9px;font:inherit}.dialog .controls{justify-content:flex-end;margin-top:18px}.hint{font-size:12px;color:#6c8275;margin-top:12px}@media(max-width:700px){.wrap{padding:12px}header{padding:8px 2px}header h1{font-size:19px}.panel{padding:15px;border-radius:15px}.toolbar{gap:10px}.controls button{padding:10px}.view{width:100%;display:grid;grid-template-columns:repeat(3,1fr)}.mobile-datebar{display:flex;gap:7px;overflow-x:auto;padding:8px 0 15px;scrollbar-width:none}.mobile-datebar button{flex:0 0 59px;display:flex;flex-direction:column;gap:5px;align-items:center;padding:10px 5px}.mobile-datebar button.active{background:#087b59;color:#fff}.mobile-list{display:block}.desktop-grid{display:none!important}.agenda{margin-top:12px}.appointment{gap:9px}.appointment .time{min-width:53px;font-size:12px}.appointment button{padding:9px}.pill{display:none}}
</style></head><body><div class="wrap"><header><div><h1>CleanProfit UK <span class="muted">/ Calendar</span></h1><span class="muted">Calendar V2 design preview · sample bookings only</span></div><span class="pill">Preview — no live data</span></header><main class="panel"><div class="toolbar"><div><h2 id="heading"></h2><span class="muted">Manage visits without leaving your calendar</span></div><button class="primary" id="new">+ New booking</button></div><div class="toolbar"><div class="controls"><button id="prev">‹</button><button id="today">Today</button><button id="next">›</button></div><div class="controls view"><button data-view="month">Month</button><button data-view="week">Week</button><button data-view="day">Day</button></div></div><div id="mobileDates" class="mobile-datebar"></div><div id="desktop" class="desktop-grid"></div><div id="mobile" class="mobile-list"></div><div class="agenda"><h2 id="agendaTitle"></h2><div id="agendaList"></div></div></main></div><div class="drawer" id="drawer"><div class="dialog"><h2 id="dialogTitle">New booking</h2><p class="muted" id="dialogNote">Design preview only — no bookings are saved.</p><label>Customer</label><input id="customer" placeholder="Customer name"><label>Date</label><input id="date" type="date"><label>Time</label><input id="time" type="time" value="09:00"><label>Duration</label><select id="duration"><option>1 hour</option><option selected>2 hours</option><option>3 hours</option><option>4 hours</option></select><div class="controls"><button id="close">Close</button><button class="primary" id="save">Preview only</button></div><p class="hint">This prototype is deliberately isolated from the live customer and booking database.</p></div></div><script>
const $=id=>document.getElementById(id),iso=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')},add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x},fmt=(d,o)=>d.toLocaleDateString('en-GB',o),startWeek=d=>add(d,-(d.getDay()+6)%7);
let selected=new Date(),anchor=new Date(),view=innerWidth<700?'day':'week';selected.setHours(12,0,0,0);anchor=new Date(selected);
const examples=[{offset:0,time:'09:00',hours:2,name:'Sarah Thompson',service:'Regular domestic clean',type:''},{offset:0,time:'13:30',hours:3,name:'Oakfield Offices',service:'Office clean',type:'blue'},{offset:1,time:'10:00',hours:2,name:'James Wilson',service:'Deep clean',type:'purple'},{offset:2,time:'08:30',hours:3,name:'Hannah Roberts',service:'Regular domestic clean',type:''},{offset:4,time:'11:00',hours:2,name:'Maple Property',service:'End-of-tenancy clean',type:'blue'},{offset:6,time:'14:00',hours:2,name:'Emily Brown',service:'Regular domestic clean',type:''}];
const base=startWeek(new Date());const events=examples.map((e,i)=>({...e,id:i,date:iso(add(base,e.offset))}));const dayEvents=d=>events.filter(e=>e.date===iso(d)).sort((a,b)=>a.time.localeCompare(b.time));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openBooking(e){$('drawer').classList.add('open');$('dialogTitle').textContent=e?'Appointment details':'New booking';$('dialogNote').textContent=e?'Sample appointment — details are not connected to live records.':'Design preview only — no bookings are saved.';$('customer').value=e?.name||'';$('date').value=e?.date||iso(selected);$('time').value=e?.time||'09:00';$('duration').value=(e?.hours||2)+' hours'}
function eventButton(e,cls='event'){return '<button class="'+cls+' '+e.type+'" data-event="'+e.id+'">'+esc(e.time)+' '+esc(e.name)+'</button>'}
function render(){
 document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
 const start=view==='month'?new Date(anchor.getFullYear(),anchor.getMonth(),1):view==='week'?startWeek(anchor):new Date(anchor);
 const end=view==='month'?new Date(anchor.getFullYear(),anchor.getMonth()+1,0):view==='week'?add(start,6):start;
 $('heading').textContent=view==='month'?fmt(start,{month:'long',year:'numeric'}):view==='week'?fmt(start,{day:'numeric',month:'short'})+' – '+fmt(end,{day:'numeric',month:'short',year:'numeric'}):fmt(start,{weekday:'long',day:'numeric',month:'long'});
 const first=startWeek(start),days=view==='month'?Array.from({length:Math.ceil((Math.round((end-first)/86400000)+1)/7)*7},(_,i)=>add(first,i)):Array.from({length:view==='week'?7:1},(_,i)=>add(start,i));
 if(view==='month'){$('desktop').innerHTML='<div class="weekdays">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(s=>'<span>'+s+'</span>').join('')+'</div><div class="month">'+days.map(d=>'<button class="date '+(d.getMonth()!==start.getMonth()?'other ':'')+(iso(d)===iso(selected)?'selected':'')+'" data-date="'+iso(d)+'"><span class="num">'+d.getDate()+'</span>'+dayEvents(d).slice(0,3).map(e=>'<span class="event '+e.type+'">'+esc(e.time)+' '+esc(e.name)+'</span>').join('')+'</button>').join('')+'</div>'}
 else{$('desktop').innerHTML='<div class="timeline"><div class="timegrid" style="--days:'+days.length+'"><div class="timehead"></div>'+days.map(d=>'<button class="timehead" data-date="'+iso(d)+'">'+fmt(d,{weekday:'short',day:'numeric'})+'</button>').join('')+'<div class="hours">'+Array.from({length:15},(_,i)=>'<span style="top:'+(i*60)+'px">'+String(i+7).padStart(2,'0')+':00</span>').join('')+'</div>'+days.map(d=>'<div class="track">'+dayEvents(d).map(e=>{const [h,m]=e.time.split(':').map(Number);return '<button class="block '+e.type+'" style="top:'+((h-7)*60+m)+'px;height:'+(e.hours*60-4)+'px" data-event="'+e.id+'"><strong>'+esc(e.time)+' · '+esc(e.name)+'</strong><span>'+esc(e.service)+'</span></button>'}).join('')+'</div>').join('')+'</div></div>'}
 const week=startWeek(selected);$('mobileDates').innerHTML=Array.from({length:7},(_,i)=>{const d=add(week,i);return '<button class="'+(iso(d)===iso(selected)?'active':'')+'" data-date="'+iso(d)+'"><span>'+fmt(d,{weekday:'short'})+'</span><strong>'+d.getDate()+'</strong></button>'}).join('');
 const mobileDays=view==='week'?Array.from({length:7},(_,i)=>add(startWeek(anchor),i)):view==='month'?days.filter(d=>d.getMonth()===anchor.getMonth()):[selected];
 $('mobile').innerHTML=mobileDays.map(d=>'<section><div class="toolbar"><strong>'+fmt(d,{weekday:'long',day:'numeric',month:'short'})+'</strong><button data-newdate="'+iso(d)+'">+ Book</button></div>'+dayEvents(d).map(e=>'<div class="appointment"><span class="time">'+esc(e.time)+'</span><div class="details"><strong>'+esc(e.name)+'</strong><span class="muted">'+esc(e.service)+' · '+e.hours+'h</span></div><button data-event="'+e.id+'">View</button></div>').join('')+(!dayEvents(d).length?'<p class="muted">No appointments</p>':'')+'</section>').join('');
 $('agendaTitle').textContent='Appointments · '+fmt(selected,{weekday:'long',day:'numeric',month:'long'});
 $('agendaList').innerHTML=dayEvents(selected).map(e=>'<div class="appointment"><span class="time">'+esc(e.time)+'</span><div class="details"><strong>'+esc(e.name)+'</strong><span class="muted">'+esc(e.service)+' · '+e.hours+'h</span></div><button data-event="'+e.id+'">View</button></div>').join('')||'<p class="muted">No appointments booked for this day.</p>';
}
document.addEventListener('click',e=>{const ev=e.target.closest('[data-event]');if(ev){openBooking(events.find(x=>x.id===Number(ev.dataset.event)));return}const date=e.target.closest('[data-date]');if(date){selected=new Date(date.dataset.date+'T12:00:00');render();return}const book=e.target.closest('[data-newdate]');if(book){selected=new Date(book.dataset.newdate+'T12:00:00');openBooking();return}});
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;anchor=new Date(selected);render()});
$('prev').onclick=()=>{anchor=view==='month'?new Date(anchor.getFullYear(),anchor.getMonth()-1,1):add(anchor,view==='week'?-7:-1);selected=new Date(anchor);render()};
$('next').onclick=()=>{anchor=view==='month'?new Date(anchor.getFullYear(),anchor.getMonth()+1,1):add(anchor,view==='week'?7:1);selected=new Date(anchor);render()};
$('today').onclick=()=>{anchor=new Date();selected=new Date();render()};$('new').onclick=()=>openBooking();$('close').onclick=()=>{$('drawer').classList.remove('open')};$('save').onclick=()=>{$('drawer').classList.remove('open')};$('drawer').onclick=e=>{if(e.target===$('drawer'))$('drawer').classList.remove('open')};render();
</script></body></html>
